# Streamlit Community Cloud: paste the lines you need into the app's Settings -> Secrets (TOML). Locally the same names
# go in .env as KEY=value; .streamlit/secrets.toml also works and is ignored by git. Every line is optional.

# Asks every visitor for this password once per browser session. Strongly recommended on a hosted copy: the dashboard holds sales data.
APP_PASSWORD = "choose-a-long-password"

# Claude features (AI suggestions, AI analyst, explanations). Prepaid credit from console.anthropic.com; a Claude subscription does not fund it.
ANTHROPIC_API_KEY = "sk-ant-..."

# Only needed to force a route. On a server `auto` already resolves to `api` because the Claude Code CLI is not installed there.
# AI_BACKEND = "api"

# How ready and virtual outsource stock combine into "available": max (default) | sum | ready | virtual.
# OUTSOURCE_AVAILABLE = "max"
